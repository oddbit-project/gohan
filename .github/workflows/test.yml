name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
