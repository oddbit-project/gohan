name: Security scan and SBOM

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  schedule:
    # weekly re-scan: new CVEs are published against unchanged dependencies
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.5'
  CYCLONEDX_GOMOD_VERSION: 'v1.12.0'
  TRIVY_VERSION: 'v0.74.0'

jobs:
  sbom:
    name: Generate and scan SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate SBOM (CycloneDX JSON)
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${{ env.CYCLONEDX_GOMOD_VERSION }} mod -licenses -json -output sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

      - name: Scan SBOM (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: sbom
          scan-ref: sbom.json
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  trivy-fs:
    name: Trivy repository scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Scan repository (SARIF, all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload results to code scanning
        # pull requests from forks get a read-only token and cannot upload
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Enforce policy (fail on CRITICAL/HIGH vulnerabilities and any secret)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  release-sbom:
    name: Attach SBOM to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ sbom, trivy-fs ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: sbom

      - uses: softprops/action-gh-release@v3
        with:
          files: sbom.json
