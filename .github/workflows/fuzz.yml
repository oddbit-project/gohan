name: fuzz

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # longer weekly run to explore beyond the seed corpus
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ FuzzIdentRoundTrip, FuzzValueNeverInlined, FuzzRawNoOrdinal ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
      - name: Fuzz ${{ matrix.target }}
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "${{ github.event_name == 'schedule' && '10m' || '60s' }}" .
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: testdata/fuzz
